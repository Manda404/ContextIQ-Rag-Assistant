name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.1.3"
  POETRY_NO_INTERACTION: "1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  HF_HUB_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  quality:
    name: Qualité et formatage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Installer Poetry
        run: python -m pip install "poetry==$POETRY_VERSION"
      - name: Installer uniquement les outils de qualité
        run: poetry install --only dev --no-root
      - name: Vérifier la configuration et le lockfile
        run: poetry check --strict
      - name: Vérifier la qualité du code et des notebooks
        run: make lint
      - name: Vérifier le formatage du code et des notebooks
        run: make format-check

  tests:
    name: Tests Python 3.15
    # Le projet s'exécute sur CPU ; macOS évite les paquets CUDA du wheel Linux.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Installer Poetry
        run: python -m pip install "poetry==$POETRY_VERSION"
      - name: Installer le projet et les dépendances verrouillées
        run: poetry install --only main
      - name: Exécuter les tests sans données privées ni modèle téléchargé
        run: make test
